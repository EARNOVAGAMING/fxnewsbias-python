[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fxnewsbias"
version = "1.0.1"
description = "AI-scored forex news sentiment for the 8 major currencies, as JSON"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "FXNewsBias" }]
keywords = [
  "forex", "fx", "trading", "algorithmic-trading", "sentiment",
  "news-sentiment", "currency", "market-data", "backtesting", "api",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Financial and Insurance Industry",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.12",
  "Topic :: Office/Business :: Financial :: Investment",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
requests = ["requests>=2.25"]
dev = ["pytest>=7", "requests>=2.25"]

[project.urls]
Homepage = "https://fxnewsbias.com"
Documentation = "https://fxnewsbias.com/developers"
Source = "https://github.com/EARNOVAGAMING/fxnewsbias-python"
Pricing = "https://fxnewsbias.com/pricing"

[tool.hatch.build.targets.wheel]
packages = ["src/fxnewsbias"]
